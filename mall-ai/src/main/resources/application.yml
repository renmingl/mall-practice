server:
  port: 9200

spring:
  application:
    name: mall-ai
  # 阶段 9 16.3：对话历史入库（ai_chat_message 表，仅登录态落库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root      # 作者本地账密，请按各自环境修改
    password: 123456    # 作者本地账密，请按各自环境修改
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456  # 作者本地账密（与 docker-compose 的 redis 密码一致），请按各自环境修改
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# AI 多模型配置（OpenAI 兼容协议，阶段 9 16.1）
# API Key 由使用者自配：docker/.env 里配环境变量（DEEPSEEK_API_KEY 等），未配置的模型自动禁用
# 各模型均为 OpenAI 兼容端点，仅 base-url 与 model 名不同；想增删模型在 providers 下加减即可
ai:
  timeout: 60s        # 上游模型单次响应读超时
  providers:
    deepseek:
      label: DeepSeek
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
    qwen:
      label: 通义千问
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY:}
      model: qwen-plus
    openai:
      label: OpenAI
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
    zhipu:
      label: 智谱 GLM
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY:}
      model: glm-4-flash

# 接口文档：doc.html（springdoc）
springdoc:
  swagger-ui:
    path: /doc.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
