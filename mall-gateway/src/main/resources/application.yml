server:
  port: 8080

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          routes:
            # 阶段 3 路由：商品服务后台管理（须在 mall-auth 的 /api/admin/** 之前匹配）
            - id: mall-product-admin
              uri: lb://mall-product
              predicates:
                - Path=/api/admin/product/**,/api/admin/category/**,/api/admin/brand/**,/api/admin/supplier/**,/api/admin/purchase/**,/api/admin/stock/**,/api/admin/upload/**
            # 阶段 2 路由：认证中心（登录/注册/JWT 鉴权）
            # 注意：Gateway 5.x 配置前缀由 spring.cloud.gateway 调整为 spring.cloud.gateway.server.webflux
            - id: mall-auth
              uri: lb://mall-auth
              predicates:
                - Path=/api/auth/**,/api/common/**,/api/admin/**
            # 阶段 2 路由：会员服务（个人资料/收货地址/积分，经网关鉴权后透传 X-User-Id）
            - id: mall-member
              uri: lb://mall-member
              predicates:
                - Path=/api/member/**
            # 阶段 3 路由：商品服务前台（列表/详情/分类树/热销）与收藏（需登录，X-User-Id）
            - id: mall-product
              uri: lb://mall-product
              predicates:
                - Path=/api/product/**,/api/favorite/**

# 接口文档：doc.html（springdoc WebFlux 适配）
springdoc:
  swagger-ui:
    path: /doc.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
