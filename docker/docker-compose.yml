# ============================================================
# mall-practice 中间件编排（镜像来自 Docker Hub，按需启动）
# 用法（在 docker/ 目录执行；自动读取同目录 .env，数据目录与账密见 .env.example）：
#   docker compose up -d                         # 基础：Nacos + MySQL + Redis
#   docker compose --profile rocketmq up -d      # 消息队列 RocketMQ
#   docker compose --profile seata up -d         # 分布式事务 Seata
#   docker compose --profile search up -d        # 搜索 Elasticsearch + Canal
#   docker compose --profile task up -d          # 任务调度 XXL-Job
#   docker compose --profile trace up -d         # 链路追踪 SkyWalking
# 微服务 + 前端应用见 docker-compose.apps.yml（一键全起：docker/build-and-run.cmd）
# ============================================================
services:
  # ---------- 注册中心 + 配置中心 ----------
  nacos:
    image: nacos/nacos-server:v3.0.0
    container_name: mall-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false   # 学习环境关闭鉴权；但 3.x 启动脚本强制要求下面三个变量非空
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE}
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "8849:8080"   # Nacos 3.x 控制台 UI（独立 8080，映射宿主机 8849）
      - "9848:9848"   # gRPC（客户端注册）
    volumes:
      - ${DOCKER_DATA_DIR}/nacos:/home/nacos/data
    restart: unless-stopped

  # ---------- 消息队列 ----------
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: mall-rocketmq-namesrv
    profiles: ["rocketmq"]
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -Xmn128m
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: mall-rocketmq-broker
    profiles: ["rocketmq"]
    depends_on:
      - rocketmq-namesrv
    environment:
      - JAVA_OPT_EXT=-Xms512m -Xmx512m -Xmn256m
    ports:
      - "10909:10909"
      - "10911:10911"
    volumes:
      # brokerIP1=127.0.0.1 保证宿主机客户端经端口映射可达 Broker
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
      - ${DOCKER_DATA_DIR}/rocketmq-broker:/home/rocketmq/store
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    restart: unless-stopped

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: mall-rocketmq-dashboard
    profiles: ["rocketmq"]
    depends_on:
      - rocketmq-namesrv
    environment:
      - JAVA_OPTS=-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8080 -Xms256m -Xmx256m
    ports:
      - "9081:8080"
    restart: unless-stopped

  # ---------- 分布式事务 ----------
  seata:
    image: apache/seata-server:2.5.0   # 与 SCA 2025.1.0.0 管理的客户端版本对齐
    container_name: mall-seata
    profiles: ["seata"]
    environment:
      - SEATA_IP=127.0.0.1
      - SEATA_PORT=8091
      - STORE_MODE=file   # 学习环境用文件存储，生产建议 DB
      - JVM_XMS=256m
      - JVM_XMX=256m
    ports:
      - "7091:7091"
      - "8091:8091"       # 事务 RPC 端口（客户端配置指向 127.0.0.1:8091）
    volumes:
      - ${DOCKER_DATA_DIR}/seata:/seata-server/sessionStore
    restart: unless-stopped

  # ---------- 搜索 ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: mall-elasticsearch
    profiles: ["search"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # 学习环境关闭安全认证（生产勿关）
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ${DOCKER_DATA_DIR}/elasticsearch:/usr/share/elasticsearch/data
    restart: unless-stopped

  # Canal Server：MySQL binlog 增量同步（mall-search 消费端，--profile search）
  # 注意：若改用本机 MySQL，需把 canal/instance.properties 的 master.address 改为 host.docker.internal:3306
  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: mall-canal
    profiles: ["search"]
    depends_on:
      - mysql
    ports:
      - "11111:11111"
    volumes:
      # 实例配置：订阅 mall 库全部表 + 连接 MySQL 账号密码（example 实例）
      - ./canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    restart: unless-stopped

  # ---------- 任务调度 ----------
  # 注意：启动前需在 MySQL 导入 sql/xxl_job.sql 建 xxl_job 库（账密在 .env 的 XXL_JOB_DB_*）；
  # 若改回本机 MySQL，连接地址换回 host.docker.internal:3306
  xxl-job:
    image: xuxueli/xxl-job-admin:3.1.0   # 3.x 基于 JDK17，与项目技术栈对齐（表结构用 sql/xxl_job.sql 3.1.0 版）
    container_name: mall-xxl-job
    profiles: ["task"]
    depends_on:
      - mysql
    environment:
      - JAVA_OPTS=-Xms256m -Xmx256m
      - PARAMS=--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=${XXL_JOB_DB_USERNAME} --spring.datasource.password=${XXL_JOB_DB_PASSWORD} --server.port=8080
    ports:
      - "9080:8080"
    restart: unless-stopped

  # ---------- 链路追踪 ----------
  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: mall-skywalking-oap
    profiles: ["trace"]
    environment:
      - SW_HEAP=512m
      - SW_STORAGE=h2        # 学习环境用 H2 存储，生产建议 ES
    ports:
      - "11800:11800"  # gRPC（agent 上报）
      - "12800:12800"  # HTTP（UI 查询）
    restart: unless-stopped

  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: mall-skywalking-ui
    profiles: ["trace"]
    depends_on:
      - skywalking-oap
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
      - JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9090:8080"
    restart: unless-stopped

  # ---------- MySQL / Redis（容器版；本机已装可删对应段） ----------
  mysql:
    image: mysql:8.3
    container_name: mall-mysql
    ports:
      - "3306:3306"
    volumes:
      - ${DOCKER_DATA_DIR}/mysql:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: mall-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}   # AOF 持久化 + 访问密码（需与各模块 application.yml 的 redis.password 一致）
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_DATA_DIR}/redis:/data
    restart: unless-stopped
