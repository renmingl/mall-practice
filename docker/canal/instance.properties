#################################################
## Canal Server instance config (example instance, mounted to
## /home/admin/canal-server/conf/example/instance.properties)
## Purpose: subscribe mall DB binlog for mall-search ES index incremental sync (phase 8, item 13.1)
## NOTE: master.address currently points to the containerized MySQL (compose service name mysql:3306);
##       if you use a host MySQL instead, change it to host.docker.internal:3306
##       (see the note in docker-compose.yml)
## Prerequisite: MySQL binlog enabled (ROW format; enabled by default in MySQL 8)
#################################################

## mysql serverId: must differ from MySQL server-id (MySQL default 1, use 1234 here)
canal.instance.mysql.slaveId=1234

# enable gtid use true/false
canal.instance.gtidon=false

## position info: leave blank on first start = sync from current binlog position
canal.instance.master.address=mysql:3306
canal.instance.master.journal.name=
canal.instance.master.position=
canal.instance.master.timestamp=
canal.instance.master.gtid=

## rds oss binlog: not needed for self-hosted MySQL, keep blank
canal.instance.rds.accesskey=
canal.instance.rds.secretkey=
canal.instance.rds.instanceId=

## table meta tsdb info: schema cache, enabled by default in official template
canal.instance.tsdb.enable=true
canal.instance.tsdb.dir=${canal.file.data.dir:../conf}/${canal.instance.destination:}
canal.instance.tsdb.url=jdbc:h2:${canal.instance.tsdb.dir}/h2;CACHE_SIZE=1000;MODE=MYSQL;
canal.instance.tsdb.dbUsername=canal
canal.instance.tsdb.dbPassword=canal

## MySQL account: must match docker-compose mysql container credentials
## (author's local defaults: root/123456; change to your own environment's account/password)
## account needs REPLICATION SLAVE / REPLICATION CLIENT privileges (root has them by default)
canal.instance.dbUsername=root
canal.instance.dbPassword=123456
canal.instance.connectionCharset = UTF-8
# enable druid Decrypt database password
canal.instance.enableDruid=false

## subscription scope: all tables of mall DB (consumer mall-search further subscribes mall.product_spu only)
canal.instance.filter.regex=mall\\..*
# exclude system tables
canal.instance.filter.black.regex=mysql\\.slave_.*

## mq related: not used in this project (mall-search consumes via canal client directly), keep blank
canal.mq.topic=
