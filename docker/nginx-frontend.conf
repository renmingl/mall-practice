# ============================================================
# mall-practice 前端 Nginx 配置（管理后台 / 前台商城共用一份）
# 由 docker/Dockerfile.frontend COPY 进镜像，勿复制到各前端模块
# 生产同域反代：/api -> 网关，/uploads -> 商品服务（容器内统一 8080）
# ============================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 静态资源 gzip（SPA 构建产物 js/css 体积较大）
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA history 路由：前端路由（vue-router createWebHistory）回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 同域反代 -> 网关（保留原始 URI，无尾斜杠）
    location /api/ {
        proxy_pass http://mall-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 商品图片直连 mall-product（上传返回 /uploads/... 相对路径）
    location /uploads/ {
        proxy_pass http://mall-product:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
