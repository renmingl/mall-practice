server:
  port: 8400

spring:
  application:
    name: mall-member
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root      # 作者本地账密，请按各自环境修改
    password: 123456    # 作者本地账密，请按各自环境修改
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456  # 作者本地账密（与 docker-compose 的 redis 密码一致），请按各自环境修改
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    # RocketMQ（spring-cloud-stream binder）：支付返积分（PAID）/ 退款扣回（REFUND）消费
    stream:
      bindings:
        pointsConsumer-in-0:
          destination: mall-member-points-topic
          group: member-points-group
          consumer:
            max-attempts: 3
      rocketmq:
        binder:
          name-server: 127.0.0.1:9876
        bindings:
          pointsConsumer-in-0:
            consumer:
              delay-level-when-next-consume: 8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 接口文档：doc.html（springdoc）
springdoc:
  swagger-ui:
    path: /doc.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
