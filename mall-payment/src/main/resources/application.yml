server:
  port: 8800

spring:
  application:
    name: mall-payment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root      # 作者本地账密，请按各自环境修改
    password: 123456    # 作者本地账密，请按各自环境修改
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456  # 作者本地账密（与 docker-compose 的 redis 密码一致），请按各自环境修改
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    # RocketMQ（spring-cloud-stream binder）：本服务仅发送（退款联动/返积分），无消费者绑定
    stream:
      rocketmq:
        binder:
          name-server: 127.0.0.1:9876

# xxl-job 执行器（阶段 6 兜底任务集中调度；@Scheduled 本地双通道兜底并存）
xxl:
  job:
    admin:
      addresses: http://127.0.0.1:9080/xxl-job-admin
    accessToken: default_token
    executor:
      appname: mall-payment
      port: 9702
      logpath: ./logs/xxl-job
      logretentiondays: 7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 接口文档：doc.html（springdoc）
springdoc:
  swagger-ui:
    path: /doc.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
