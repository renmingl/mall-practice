# ============================================================
# mall-practice CI：push 到 master 后自动构建全部镜像并推送到 GHCR
# （GHCR = GitHub Container Registry，GitHub 自带镜像仓库，无需额外 Token，
#  仓库需开启 Actions 权限：Settings -> Actions -> General -> Workflow permissions）
#
# 产物：ghcr.io/<GitHub用户名>/<模块>:<commit SHA> 与 :latest（15 个镜像：后端 13 + 前端 2）
# 部署端拉取：docker compose pull（配合 IMAGE_PREFIX 环境变量，见 docs/deployment.md）
# ============================================================
name: Docker Build & Push

on:
  push:
    branches: [master]
    # 只有后端/前端/docker 相关代码变化才触发；纯文档变更不浪费构建
    paths:
      - 'mall-*/**'
      - 'docker/**'
      - 'pom.xml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch: # 支持手动触发：Actions 页面 -> Run workflow

jobs:
  backend:
    name: Backend images (13)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送 GHCR 需要
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 13 个后端共用 docker/app/backend/Dockerfile 模板，循环构建推送
      - name: Build & push backend images
        env:
          PREFIX: ghcr.io/${{ github.repository_owner }} # 仓库名需全小写
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          PREFIX=$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')
          for mod in mall-auth mall-admin mall-portal mall-member mall-product \
                     mall-cart mall-order mall-payment mall-coupon mall-seckill \
                     mall-search mall-ai mall-gateway; do
            echo "==> Building $mod"
            docker build -f docker/app/backend/Dockerfile --build-arg MODULE=$mod \
              -t ${PREFIX}/$mod:${TAG} -t ${PREFIX}/$mod:latest .
            docker push ${PREFIX}/$mod:${TAG}
            docker push ${PREFIX}/$mod:latest
          done

  frontend:
    name: Frontend images (2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push mall-web-admin
        env:
          PREFIX: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          PREFIX=$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')
          # 前后端共用 docker/app/frontend/Dockerfile，APP_DIR 区分模块（构建上下文=仓库根）
          docker build -f docker/app/frontend/Dockerfile --build-arg APP_DIR=mall-web-admin \
            -t ${PREFIX}/mall-web-admin:${TAG} -t ${PREFIX}/mall-web-admin:latest .
          docker push ${PREFIX}/mall-web-admin:${TAG}
          docker push ${PREFIX}/mall-web-admin:latest

      - name: Build & push mall-web-portal
        env:
          PREFIX: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          PREFIX=$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')
          docker build -f docker/app/frontend/Dockerfile --build-arg APP_DIR=mall-web-portal \
            -t ${PREFIX}/mall-web-portal:${TAG} -t ${PREFIX}/mall-web-portal:latest .
          docker push ${PREFIX}/mall-web-portal:${TAG}
          docker push ${PREFIX}/mall-web-portal:latest
