server:
  port: 8500

spring:
  application:
    name: mall-product
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root      # 作者本地账密，请按各自环境修改
    password: 123456    # 作者本地账密，请按各自环境修改
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456  # 作者本地账密（与 docker-compose 的 redis 密码一致），请按各自环境修改
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    # RocketMQ（spring-cloud-stream binder）：退款回补库存消费者
    stream:
      bindings:
        stockRefundConsumer-in-0:
          destination: mall-stock-refund-topic
          group: product-group
          consumer:
            max-attempts: 3
      rocketmq:
        binder:
          name-server: 127.0.0.1:9876
        bindings:
          stockRefundConsumer-in-0:
            consumer:
              delay-level-when-next-consume: 8

# Seata AT：扣库存为全局事务参与方（order 发起 @GlobalTransactional）；file registry 直连本地 TC（docker-compose 已就绪）
seata:
  enabled: true
  application-id: mall-product
  tx-service-group: mall_tx_group
  registry:
    type: file
  config:
    type: file
  service:
    vgroup-mapping:
      mall_tx_group: default
    grouplist:
      default: 127.0.0.1:8091

# 商品模块自定义配置
mall:
  product:
    # 图片上传：本地存储目录（oss.enabled=false 时生效；绝对路径避免 Tomcat work 目录漂移）
    upload-dir: ./uploads
    # 阿里云 OSS：enabled=true 启用后图片自动上传 OSS，本地目录不生效；密钥请改为各自环境配置（建议环境变量注入）
    oss:
      enabled: false
      endpoint: ""            # 例：oss-cn-hangzhou.aliyuncs.com
      access-key-id: ""
      access-key-secret: ""
      bucket: ""
      domain: ""              # 可选：自定义访问域名（CDN/绑定域名），为空则用 https://{bucket}.{endpoint}
      dir-prefix: product     # 对象存储前缀目录
    # 缓存三防：详情缓存基础 TTL（秒）+ TTL 随机偏移上限（秒，防雪崩）
    detail-cache-ttl: 1800
    detail-cache-ttl-jitter: 300
    # 缓存预热：每次预热的商品数（销量 Top N）
    preload-top: 20

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 接口文档：doc.html（springdoc）
springdoc:
  swagger-ui:
    path: /doc.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
