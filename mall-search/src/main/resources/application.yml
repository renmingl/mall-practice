      host: 127.0.0.1
      port: 6379
      password: 123456  # 作者本地账密（与 docker-compose 的 redis 密码一致），请按各自环境修改
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  # TODO 搜索章节补充：elasticsearch.uris=http://127.0.0.1:9200

management:
  endpoints:
    web:
      exposure:
        include: health,info
